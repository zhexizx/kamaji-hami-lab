# tunnel-probe 经 apiserver 的节点代理抓取，需要这个权限。
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus-tunnel-probe
rules:
  - apiGroups: [""]
    resources: ["nodes/proxy"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-tunnel-probe
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus-tunnel-probe
subjects:
  - kind: ServiceAccount
    name: prometheus-server
    namespace: monitoring
