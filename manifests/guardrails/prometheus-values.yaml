alertmanager:
  enabled: false
prometheus-pushgateway:
  enabled: false
# 告警只用 kube-state-metrics 和 agent 指标；节点容器里跑 node-exporter 没有用处。
prometheus-node-exporter:
  enabled: false
server:
  persistentVolume:
    enabled: false
  global:
    scrape_interval: 15s
    evaluation_interval: 15s
extraScrapeConfigs: |
  - job_name: konnectivity-agent
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [kube-system]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_k8s_app]
        regex: konnectivity-agent
        action: keep
      - source_labels: [__meta_kubernetes_pod_ip]
        target_label: __address__
        replacement: $1:8134
  # 经 apiserver 的节点代理抓 kubelet：apiserver → konnectivity → 节点，和调用 webhook 同样经过隧道。
  # chart 自带的 kubernetes-nodes 直连 kubelet，不经过隧道，不能用来探测。只需要 up，其他指标都丢弃。
  - job_name: tunnel-probe
    scheme: https
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    scrape_timeout: 10s
    kubernetes_sd_configs:
      - role: node
    relabel_configs:
      - target_label: __address__
        replacement: kubernetes.default.svc:443
      - source_labels: [__meta_kubernetes_node_name]
        regex: (.+)
        target_label: __metrics_path__
        replacement: /api/v1/nodes/$1/proxy/metrics
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: .+
        action: drop
  # HAMi webhook 和这些指标由同一个进程（vgpu-scheduler-extender）提供：webhook 在 9443，指标在 9395。
  # 只能发现进程不在或指标端口不通，发现不了“进程在、webhook 处理逻辑坏了”。
  - job_name: hami-scheduler
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [kube-system]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
        regex: hami-scheduler
        action: keep
      - source_labels: [__meta_kubernetes_pod_container_port_name]
        regex: metrics
        action: keep
serverFiles:
  alerting_rules.yml:
    groups:
      - name: gpu-platform
        rules:
          # 不部署计划里的 KonnectivityAgentUnavailable：隧道断开时 agent Pod 仍然可用，它不会触发。
          # 降级实验需要复现这一点时，用 manifests/experiments/prom-experiment-rules.yaml 临时加上。
          # agent 自己上报的到 konnectivity-server 的连接数。
          - alert: KonnectivityAgentDisconnected
            expr: konnectivity_network_proxy_agent_open_server_connections < 1 or absent(konnectivity_network_proxy_agent_open_server_connections)
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "konnectivity-agent has no connection to konnectivity-server"
          # 端到端探测：见上面的 tunnel-probe。
          - alert: ApiserverToNodePathDown
            expr: up{job="tunnel-probe"} == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "apiserver cannot reach a node through the tunnel, HAMi webhook may be unreachable"
          # HAMi webhook 所在的进程不在或指标端口不通。缩到 0 时没有抓取目标，所以也要看 absent。
          - alert: HamiWebhookDown
            expr: up{job="hami-scheduler"} == 0 or absent(up{job="hami-scheduler"})
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "hami-scheduler (HAMi webhook) is down, GPU Pods will be rejected by require-hami-scheduler"
          # apiserver 记录的“HAMi webhook 调用失败、按 Ignore 放行”。隧道断开和 webhook 挂掉都会让它增加，
          # 而且只在真的有 Pod 被放行时才触发，直接对应用户受到的影响。事件型告警：最后一次放行后约 5 分钟解除。
          # 计数器在第一次放行前不存在，只用 increase() 会漏掉第一次，所以也看“5 分钟前还没有这个计数器”；
          # Prometheus 刚启动时没有 5 分钟前的数据，这一条不算，避免误报。
          - alert: HamiWebhookFailOpen
            expr: |
              increase(apiserver_admission_webhook_fail_open_count{name="vgpu.hami.io"}[5m]) > 0
              or (
                apiserver_admission_webhook_fail_open_count{name="vgpu.hami.io"}
                  unless apiserver_admission_webhook_fail_open_count{name="vgpu.hami.io"} offset 5m
              ) and on() (time() - process_start_time_seconds{job="prometheus"} > 300)
            labels:
              severity: warning
            annotations:
              summary: "Pods were admitted without HAMi webhook (fail-open); GPU Pods may bypass HAMi"
